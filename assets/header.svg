<svg xmlns="http://www.w3.org/2000/svg" width="854" height="200" viewBox="0 0 854 200">
  <style>
    .text { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .desc { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b9e6ff; letter-spacing: 1px; }
    .text, .desc { opacity: 0; animation: fadeIn 1.2s ease-in-out forwards; }
    .desc { animation-delay: 0.4s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="854" height="200" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="854" height="200" fill="url(#bg)"/>
    <path fill="#36bcf7" opacity="0.12">
      <animate attributeName="d" dur="20s" repeatCount="indefinite"
        values="M0 200L0 150Q213 120 427 150T854 140L854 200Z;M0 200L0 140Q213 170 427 140T854 155L854 200Z;M0 200L0 150Q213 120 427 150T854 140L854 200Z"/>
    </path>
    <path fill="#36bcf7" opacity="0.18">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M0 200L0 170Q213 150 427 170T854 165L854 200Z;M0 200L0 165Q213 185 427 160T854 175L854 200Z;M0 200L0 170Q213 150 427 170T854 165L854 200Z"/>
    </path>
  </g>
  <text x="50%" y="40%" text-anchor="middle" dominant-baseline="middle" class="text">Hameem Mohamed Imthath</text>
  <text x="50%" y="60%" text-anchor="middle" dominant-baseline="middle" class="desc">Team Lead • Full-Stack &amp; Mobile Developer</text>
</svg>
